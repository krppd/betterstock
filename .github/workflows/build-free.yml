name: Build Free

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm --clean BetterStock.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BetterStock-Windows
          path: dist/BetterStock/
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/BetterStock/**
          generate_release_notes: false
          body: |
            BetterStock Free (edición libre, MIT).

            Verificación de integridad: SHA-256 publicado en el release y en el README.
