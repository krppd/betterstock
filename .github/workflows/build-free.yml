name: Build Free

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build with PyInstaller
        env:
          BETTERSTOCK_VERSION: ${{ github.ref_name }}
        run: pyinstaller --noconfirm --clean BetterStock.spec

      - name: Package artifact
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          Compress-Archive -Path dist/BetterStock -DestinationPath "dist/BetterStock-$version.zip" -Force
          $hash = (Get-FileHash -Algorithm SHA256 "dist/BetterStock-$version.zip").Hash
          "SHA256=$hash" | Out-File -FilePath dist/SHA256.txt -Encoding utf8
          Get-Content dist/SHA256.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BetterStock-Windows
          path: dist/
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/BetterStock-*.zip
            dist/SHA256.txt
          generate_release_notes: false
          body: |
            BetterStock Free (edición libre, MIT).

            Verificación de integridad: SHA-256 publicado en `SHA256.txt` de este release.
