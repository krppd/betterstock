name: Build Free

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  actions: read

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      executable_artifact_id: ${{ steps.upload-executable.outputs.artifact-id }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build with PyInstaller
        env:
          BETTERSTOCK_VERSION: ${{ github.ref_name }}
        run: pyinstaller --noconfirm --clean BetterStock.spec

      - name: Read the version
        id: version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+') {
            $version = (python -c "import config; print(config.APP_VERSION)")
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Output "version=$version"

      - name: Upload the unsigned executable
        id: upload-executable
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          path: dist/BetterStock/BetterStock.exe
          if-no-files-found: error
          archive: false

      - name: Upload the portable build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: BetterStock-Package
          path: dist/BetterStock
          if-no-files-found: error

  publish:
    needs: build-windows
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - name: Download the portable build
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: BetterStock-Package
          path: dist/BetterStock

      - name: Submit the signing request
        id: sign
        if: vars.SIGNPATH_PROJECT_SLUG != ''
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ needs.build-windows.outputs.executable_artifact_id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: "3600"
          output-artifact-directory: signed
          skip-decompress: true

      - name: Put the signed executable in the build
        if: steps.sign.outcome == 'success'
        shell: pwsh
        run: |
          $firmado = Get-ChildItem -Path signed -Filter *.exe -Recurse | Select-Object -First 1
          if (-not $firmado) { throw "No se encontro el ejecutable firmado" }
          Copy-Item -Path $firmado.FullName -Destination dist\BetterStock\BetterStock.exe -Force
          Write-Output "signed: $($firmado.FullName)"

      - name: Package the build
        shell: pwsh
        run: |
          $version = "${{ needs.build-windows.outputs.version }}"
          Compress-Archive -Path dist\BetterStock -DestinationPath "dist\BetterStock-$version.zip" -Force
          $hash = (Get-FileHash -Algorithm SHA256 "dist\BetterStock-$version.zip").Hash
          "SHA256=$hash" | Out-File -FilePath dist\SHA256.txt -Encoding utf8
          Get-Content dist\SHA256.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: 'dist/BetterStock-*.zip'

      - name: Create GitHub Release
        uses: softprops/action-gh-release@40c2ca6ddd77ba2a30bbea8f67409c0f76868d67 # v3
        with:
          files: |
            dist/BetterStock-*.zip
            dist/SHA256.txt
          generate_release_notes: false
          body: |
            BetterStock Free (edicion libre, MIT).

            Verificacion de integridad: SHA-256 publicado en `SHA256.txt` de este release.

            ${{ steps.sign.outcome == 'success' && 'El ejecutable va firmado con el certificado de SignPath Foundation.' || 'El ejecutable no va firmado: Windows SmartScreen avisa la primera vez.' }}
